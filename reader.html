<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FocusRead</title>
<style>
  :root {
    --bg: #faf7f0;         /* warm paper cream default */
    --fg: #1f1c18;
    --bold: #000000;
    --muted: #78726a;
    --border: #e4ddd0;
    --link: #1558d6;
    --accent: #2d7a55;
  }
  html.tint-sepia    { --bg: #f5ecd7; --fg: #3d2f1e; --bold: #1a1208; --muted: #8a7357; --border: #d9c9aa; --link: #8c5a1e; }
  html.tint-paper    { --bg: #ffffff; --fg: #1a1a1a; --bold: #000; --muted: #666; --border: #ddd; --link: #1558d6; }
  html.tint-solarized{ --bg: #fdf6e3; --fg: #586e75; --bold: #073642; --muted: #93a1a1; --border: #eee8d5; --link: #268bd2; }
  html.tint-dim      { --bg: #1b1917; --fg: #ededed; --bold: #ffffff; --muted: #8a8680; --border: #2f2c2a; --link: #9ec5ff; --accent: #7DCFA6; }
  html.tint-night    { --bg: #0a0a0a; --fg: #b8b8b8; --bold: #e8e8e8; --muted: #666;    --border: #222;    --link: #6ea0e0; --accent: #7DCFA6; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-size: 18px;
    line-height: 1.7;
  }
  .bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  .bar h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.5px; color: var(--bold); font-family: inherit; }
  .bar h1 b { font-weight: 800; }
  .bar .src {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bar button, .bar select {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }
  .bar button:hover:not(:disabled) { background: rgba(125, 125, 125, 0.08); }
  .bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .bar select { padding: 4px 6px; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }
  h1.title { font-size: 32px; line-height: 1.25; margin: 0 0 8px; color: var(--bold); font-weight: 700; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 32px; font-family: -apple-system, sans-serif; }
  article p, article li, article blockquote { margin-bottom: 1em; }
  article img { max-width: 100%; height: auto; display: block; margin: 1.5em auto; border-radius: 4px; }
  article a { color: var(--link); }
  article blockquote { border-left: 3px solid var(--border); padding-left: 16px; color: var(--muted); font-style: italic; }
  article h1, article h2, article h3, article h4 { color: var(--bold); font-weight: 700; line-height: 1.3; margin: 1.5em 0 0.5em; }
  article h1 { font-size: 24px; }
  article h2 { font-size: 22px; }
  article h3 { font-size: 19px; }
  article pre, article code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; background: rgba(128,128,128,0.1); padding: 2px 4px; border-radius: 3px; }
  article pre { padding: 12px; overflow-x: auto; }
  article b, article strong { color: var(--bold); font-weight: 700; }
  article .speaking { background: rgba(125, 207, 166, 0.18); border-radius: 3px; }
  .status { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 13px; }
  .summary {
    border: 1px solid var(--border);
    border-left: 3px solid #7DCFA6;
    border-radius: 6px;
    padding: 14px 18px;
    margin: 0 0 32px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    background: rgba(125, 207, 166, 0.04);
  }
  .summary-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #7DCFA6;
    margin-bottom: 8px;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
  }
  .summary[hidden] { display: none; }
  /* Chunk mode overlay */
  .chunk-view {
    position: fixed;
    inset: 44px 0 0 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px;
    z-index: 5;
  }
  .chunk-view[hidden] { display: none; }
  .chunk-display {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 56px;
    font-weight: 400;
    color: var(--fg);
    text-align: center;
    line-height: 1.2;
    min-height: 80px;
    max-width: 900px;
    letter-spacing: -0.5px;
  }
  .chunk-display b { color: var(--bold); font-weight: 800; }
  .chunk-controls {
    display: flex;
    gap: 14px;
    align-items: center;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  .chunk-controls button, .chunk-controls select, .chunk-controls input {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  .chunk-controls .big {
    font-size: 16px;
    padding: 8px 16px;
    min-width: 44px;
  }
  .chunk-controls input[type="range"] {
    padding: 0;
    width: 140px;
    cursor: pointer;
  }
  .chunk-progress { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { color: #ff7b7b; padding: 16px; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.3); border-radius: 4px; margin: 16px 24px; font-size: 13px; }
</style>
</head>
<body>
<div class="bar">
  <h1><b>Foc</b>us<b>Re</b>ad</h1>
  <span class="src" id="src">—</span>
  <button id="play" title="Read aloud" disabled>▶</button>
  <button id="chunks" title="Speed read in chunks" disabled>Chunks</button>
  <button id="summarize" title="On-device AI summary (Chrome Nano)" disabled>Summarize</button>
  <select id="tint" title="Tint">
    <option value="off">Paper (light)</option>
    <option value="sepia">Sepia</option>
    <option value="solarized">Solarized</option>
    <option value="dim">Dim</option>
    <option value="night">Night</option>
  </select>
  <button id="exit" title="Back to original">Exit</button>
</div>
<main>
  <div class="status" id="status">Loading…</div>
  <h1 class="title" id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="summary" id="summary" hidden>
    <div class="summary-label">TL;DR</div>
    <div id="summaryText"></div>
  </div>
  <article id="article"></article>
</main>
<div class="chunk-view" id="chunkView" hidden>
  <div class="chunk-progress"><span id="chunkPos">0</span> / <span id="chunkTotal">0</span></div>
  <div class="chunk-display" id="chunkDisplay"></div>
  <div class="chunk-controls">
    <button id="chunkBack" title="Back">◀</button>
    <button id="chunkPlay" class="big" title="Play/pause">▶</button>
    <button id="chunkNext" title="Forward">▶</button>
    <span>WPM</span>
    <input type="range" id="chunkWpm" min="100" max="800" step="25" value="300">
    <span id="chunkWpmVal" style="min-width: 34px; text-align: left;">300</span>
    <span>Chunk</span>
    <select id="chunkSize">
      <option value="1">1 word</option>
      <option value="2" selected>2 words</option>
      <option value="3">3 words</option>
      <option value="4">4 words</option>
    </select>
    <button id="chunkClose">Close</button>
  </div>
</div>
<script src="core.js"></script>
<script src="reader.js"></script>
</body>
</html>
