<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="440" height="280" fill="#faf7f0"/>
  <path d="M 0 0 L 88 0 L 0 88 Z" fill="#2d7a55" opacity="0.08"/>

  <!-- Sage F mark, 64x64 -->
  <g transform="translate(34, 34)">
    <rect width="64" height="64" rx="14" fill="#101614"/>
    <g transform="translate(18, 14) scale(0.38)" fill="#7DCFA6">
      <rect x="36" y="28" width="22" height="72" rx="2"/>
      <rect x="36" y="28" width="38" height="18" rx="2"/>
      <rect x="36" y="56" width="28" height="16" rx="2"/>
    </g>
    <g transform="translate(18, 14) scale(0.38)" fill="#7DCFA6" fill-opacity="0.4">
      <rect x="74" y="28" width="24" height="18" rx="2"/>
      <rect x="64" y="56" width="14" height="16" rx="2"/>
    </g>
  </g>

  <!-- Single-weight wordmark (renders reliably) -->
  <text x="114" y="72" fill="#1f1c18"
        font-family="Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" letter-spacing="-0.8">FocusRead</text>

  <text x="114" y="96" fill="#78726a"
        font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500">Read the web faster</text>

  <!-- Card showing bionic as visual bars (solid + faded per "word") -->
  <g transform="translate(34, 140)">
    <rect width="372" height="108" rx="10" fill="#ffffff" stroke="#e4ddd0" stroke-width="1"/>

    <!-- line 1 -->
    <g transform="translate(20, 26)">
      <rect width="44" height="10" rx="2" fill="#1f1c18"/>
      <rect x="48" width="32" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="88" width="32" height="10" rx="2" fill="#1f1c18"/>
      <rect x="124" width="50" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="180" width="28" height="10" rx="2" fill="#1f1c18"/>
      <rect x="212" width="40" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
    </g>
    <!-- line 2 -->
    <g transform="translate(20, 52)">
      <rect width="36" height="10" rx="2" fill="#1f1c18"/>
      <rect x="40" width="44" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="92" width="28" height="10" rx="2" fill="#1f1c18"/>
      <rect x="124" width="34" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="164" width="42" height="10" rx="2" fill="#1f1c18"/>
      <rect x="212" width="52" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="272" width="32" height="10" rx="2" fill="#1f1c18"/>
    </g>
    <!-- line 3 (shorter) -->
    <g transform="translate(20, 78)">
      <rect width="38" height="10" rx="2" fill="#1f1c18"/>
      <rect x="42" width="28" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="74" width="52" height="10" rx="2" fill="#1f1c18"/>
      <rect x="130" width="48" height="10" rx="2" fill="#1f1c18" fill-opacity="0.35"/>
      <rect x="184" width="32" height="10" rx="2" fill="#1f1c18"/>
    </g>
  </g>
</svg>
