<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .paper { fill: #faf7f0; }
    .ink { fill: #1f1c18; }
    .muted { fill: #78726a; }
    .sage { fill: #2d7a55; }
    .border { fill: #e4ddd0; }
  </style>

  <!-- bg -->
  <rect width="1280" height="800" fill="#f4eed9"/>
  <rect x="40" y="40" width="1200" height="720" rx="14" class="paper"/>

  <!-- window chrome -->
  <rect x="40" y="40" width="1200" height="44" rx="14" fill="#e8e1cf"/>
  <rect x="40" y="68" width="1200" height="16" fill="#e8e1cf"/>
  <circle cx="66" cy="62" r="6" fill="#ed6a5e"/>
  <circle cx="86" cy="62" r="6" fill="#f5bf4f"/>
  <circle cx="106" cy="62" r="6" fill="#62c554"/>

  <!-- big chunk display (RSVP) -->
  <g transform="translate(640, 380)" text-anchor="middle" font-family="'Iowan Old Style', Georgia, serif">
    <text xml:space="preserve" font-size="72" class="ink">
      <tspan font-weight="800">ant</tspan><tspan opacity="0.55">icipates</tspan><tspan opacity="0.55"> </tspan><tspan font-weight="800">mea</tspan><tspan opacity="0.55">ning</tspan>
    </text>
  </g>
  <text xml:space="preserve" x="640" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" class="muted" letter-spacing="0.14em">CHUNK 42 / 316</text>

  <!-- progress -->
  <rect x="300" y="474" width="680" height="4" rx="2" class="border"/>
  <rect x="300" y="474" width="90" height="4" rx="2" class="sage"/>

  <!-- controls -->
  <g transform="translate(380, 540)" font-family="-apple-system, sans-serif" font-size="13">
    <rect x="0" y="0" width="72" height="44" rx="8" fill="#faf7f0" stroke="#e4ddd0"/>
    <text xml:space="preserve" x="36" y="28" text-anchor="middle" class="ink">◀◀</text>

    <rect x="84" y="0" width="72" height="44" rx="8" class="sage"/>
    <text xml:space="preserve" x="120" y="30" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">▶</text>

    <rect x="168" y="0" width="72" height="44" rx="8" fill="#faf7f0" stroke="#e4ddd0"/>
    <text xml:space="preserve" x="204" y="28" text-anchor="middle" class="ink">▶▶</text>

    <g transform="translate(276, 0)">
      <rect width="244" height="44" rx="8" fill="#faf7f0" stroke="#e4ddd0"/>
      <text xml:space="preserve" x="16" y="28" class="muted">Speed</text>
      <rect x="72" y="20" width="140" height="4" rx="2" fill="#e4ddd0"/>
      <rect x="72" y="20" width="78" height="4" rx="2" class="sage"/>
      <circle cx="150" cy="22" r="7" class="sage"/>
      <text xml:space="preserve" x="226" y="28" text-anchor="end" class="ink" font-weight="600">420 wpm</text>
    </g>
  </g>

  <!-- shortcut hint -->
  <g transform="translate(380, 610)" font-family="-apple-system, sans-serif" font-size="12" class="muted">
    <text xml:space="preserve" x="0" y="14">Space: play/pause ·  ← →: step  ·  Esc: exit</text>
  </g>

  <!-- header bar -->
  <g transform="translate(72, 118)" font-family="-apple-system, sans-serif" font-size="14" class="ink">
    <text xml:space="preserve"><tspan font-weight="800">Arc</tspan><tspan>aRead</tspan></text>
  </g>
  <line x1="40" y1="142" x2="1240" y2="142" stroke="#e4ddd0"/>
  <text xml:space="preserve" x="160" y="118" font-family="ui-monospace, Menlo, monospace" font-size="11" class="muted">Chunks mode · paragraph 8 of 24</text>

  <!-- caption -->
  <text xml:space="preserve" x="640" y="732" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" class="ink" font-weight="600">Phrase-chunking speed read — 100 to 800 wpm, bionic still applied</text>
</svg>
