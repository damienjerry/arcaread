<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BionicRead</title>
<style>
  :root {
    --bg: #111;
    --fg: #fff;
    --muted: #888;
    --accent: #fff;
    --border: #333;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    width: 280px;
  }
  .wrap { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  h1 b { font-weight: 800; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .col { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; color: var(--fg); }
  .hint { font-size: 11px; color: var(--muted); }
  .site {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 170px;
  }
  hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 0;
  }
  /* Toggle switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 34px;
    height: 18px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #333;
    border-radius: 18px;
    transition: background 0.15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 14px;
    width: 14px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.15s;
  }
  input:checked + .slider { background: #fff; }
  input:checked + .slider::before {
    transform: translateX(16px);
    background: #111;
  }
  input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }
  /* Range slider */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    width: 100%;
    height: 18px;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: #333;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    height: 12px;
    width: 12px;
    border-radius: 50%;
    background: #fff;
    margin-top: -5px;
    border: 0;
  }
  .val {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 11px;
    min-width: 36px;
    text-align: right;
  }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1><b>Bion</b>icRead</h1>

  <div class="row">
    <div class="col">
      <label for="enabled">Enabled</label>
      <span class="hint">Global on/off</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <hr>

  <div class="row">
    <div class="col">
      <label for="siteEnabled">This site</label>
      <span class="site" id="hostname">—</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="siteEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <hr>

  <div class="col">
    <div class="label-row">
      <label for="minWordLength">Min word length</label>
      <span class="val"><span id="minWordLengthVal">4</span> ch</span>
    </div>
    <input type="range" id="minWordLength" min="3" max="10" step="1" value="4">
  </div>

  <div class="col">
    <div class="label-row">
      <label for="fontSizeThreshold">Min font size</label>
      <span class="val"><span id="fontSizeThresholdVal">14</span> px</span>
    </div>
    <input type="range" id="fontSizeThreshold" min="10" max="20" step="1" value="14">
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
