<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BionicRead</title>
<style>
  :root {
    --bg: #111;
    --fg: #fff;
    --muted: #888;
    --border: #333;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    width: 300px;
  }
  .wrap { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  h1 b { font-weight: 800; }
  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .reset {
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 2px 6px;
    cursor: pointer;
    font-family: inherit;
    text-transform: none;
    letter-spacing: 0;
  }
  .reset:hover { color: #fff; }
  .reset:disabled { opacity: 0.4; cursor: default; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  label { font-size: 12px; color: var(--fg); }
  .hint { font-size: 11px; color: var(--muted); }
  .site {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 2px 0;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 34px;
    height: 18px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-track {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #333;
    border-radius: 18px;
    transition: background 0.15s;
  }
  .slider-track::before {
    content: "";
    position: absolute;
    height: 14px;
    width: 14px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.15s;
  }
  input:checked + .slider-track { background: #fff; }
  input:checked + .slider-track::before {
    transform: translateX(16px);
    background: #111;
  }
  input:disabled + .slider-track { opacity: 0.4; cursor: not-allowed; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    width: 100%;
    height: 18px;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: #333;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    height: 12px;
    width: 12px;
    border-radius: 50%;
    background: #fff;
    margin-top: -5px;
    border: 0;
  }
  .val {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 11px;
    min-width: 36px;
    text-align: right;
  }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
    margin-left: 6px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .dot.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1><b>Bion</b>icRead</h1>

  <div class="row">
    <div class="col">
      <label for="enabled">Enabled</label>
      <span class="hint">Extension master switch</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider-track"></span>
    </label>
  </div>

  <div class="row">
    <div class="col">
      <label for="processIframes">Process iframes</label>
      <span class="hint">Needed for Gmail; off hides effect in embeds</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="processIframes">
      <span class="slider-track"></span>
    </label>
  </div>

  <hr>

  <div class="section-label">
    <span>This site<span class="dot" id="overrideDot"></span></span>
    <button class="reset" id="reset" type="button">Reset</button>
  </div>
  <span class="site" id="hostname">—</span>

  <div class="row">
    <div class="col">
      <label for="siteEnabled">Active on this site</label>
    </div>
    <label class="switch">
      <input type="checkbox" id="siteEnabled">
      <span class="slider-track"></span>
    </label>
  </div>

  <div class="row">
    <div class="col">
      <label for="smartMode">Articles only</label>
      <span class="hint">Skip nav &amp; chrome when an article is detected</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="smartMode">
      <span class="slider-track"></span>
    </label>
  </div>

  <div class="col">
    <div class="label-row">
      <label for="intensity">Bold intensity</label>
      <span class="val"><span id="intensityVal">50</span>%</span>
    </div>
    <input type="range" id="intensity" min="25" max="75" step="5" value="50">
  </div>

  <div class="col">
    <div class="label-row">
      <label for="minWordLength">Min word length</label>
      <span class="val"><span id="minWordLengthVal">4</span> ch</span>
    </div>
    <input type="range" id="minWordLength" min="3" max="10" step="1" value="4">
  </div>

  <div class="col">
    <div class="label-row">
      <label for="fontSizeThreshold">Min font size</label>
      <span class="val"><span id="fontSizeThresholdVal">14</span> px</span>
    </div>
    <input type="range" id="fontSizeThreshold" min="10" max="20" step="1" value="14">
  </div>

  <div class="col">
    <div class="label-row">
      <label for="fontSizeMax">Max font size</label>
      <span class="val"><span id="fontSizeMaxVal">24</span> px</span>
    </div>
    <input type="range" id="fontSizeMax" min="18" max="60" step="1" value="24">
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
