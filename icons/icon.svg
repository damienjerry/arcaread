<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="28" fill="#101614"/>
  <!-- "A" for ArcaRead. Left stem + left half of crossbar are solid;
       right stem + right half of crossbar are faded. Echoes the bionic
       first-half/second-half bolding that the extension applies. -->
  <g stroke-linecap="round" stroke-width="14" fill="none">
    <!-- Left stem: apex → bottom-left (solid) -->
    <line x1="64" y1="26" x2="30" y2="102" stroke="#7DCFA6"/>
    <!-- Right stem: apex → bottom-right (faded) -->
    <line x1="64" y1="26" x2="98" y2="102" stroke="#7DCFA6" stroke-opacity="0.38"/>
  </g>
  <g stroke-linecap="round" stroke-width="12" fill="none">
    <!-- Crossbar left half (solid) -->
    <line x1="48" y1="70" x2="64" y2="70" stroke="#7DCFA6"/>
    <!-- Crossbar right half (faded) -->
    <line x1="64" y1="70" x2="80" y2="70" stroke="#7DCFA6" stroke-opacity="0.38"/>
  </g>
</svg>
