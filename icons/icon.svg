<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="28" fill="#101614"/>
  <!-- Bold A for ArcaRead. Solid strokes for unambiguous recognition at 16px.
       Bionic concept carried by the crossbar: left half solid, right half slightly
       softened (still readable at small sizes). -->
  <g fill="none" stroke="#7DCFA6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left stem: apex → bottom-left -->
    <line x1="64" y1="22" x2="24" y2="110" stroke-width="20"/>
    <!-- Right stem: apex → bottom-right -->
    <line x1="64" y1="22" x2="104" y2="110" stroke-width="20"/>
    <!-- Crossbar solid half -->
    <line x1="42" y1="76" x2="64" y2="76" stroke-width="16"/>
    <!-- Crossbar faded half -->
    <line x1="64" y1="76" x2="86" y2="76" stroke-width="16" stroke-opacity="0.45"/>
  </g>
</svg>
