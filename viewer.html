<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcaread PDF</title>
<style>
  :root {
    --bg: #faf7f0;
    --fg: #1f1c18;
    --muted: #78726a;
    --hairline: #e4ddd0;
    --surface: #ffffff;
    --sage: #2d7a55;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 18px; line-height: 1.75;
  }
  .bar {
    position: sticky; top: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(140%) blur(12px);
    -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--hairline);
    padding: 12px 20px;
    display: flex; gap: 12px; align-items: center;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .bar h1 { font-size: 14px; margin: 0; font-weight: 400; letter-spacing: -0.01em; color: var(--fg); font-family: inherit; }
  .bar h1 b { font-weight: 800; }
  .bar .src {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bar button {
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--hairline);
    padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font: inherit; font-size: 12px;
    transition: background .15s, border-color .15s;
  }
  .bar button:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); border-color: var(--muted); }
  main {
    max-width: 720px; margin: 0 auto;
    padding: 48px 28px 120px;
  }
  .page { padding: 0 0 40px; }
  .page + .page {
    border-top: 1px dashed var(--hairline);
    padding-top: 40px;
  }
  .page-num {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .para { margin: 0 0 1.1em; }
  b { font-weight: 700; color: #000; }
  .status {
    text-align: center; color: var(--muted);
    padding: 48px 16px; font-size: 13px;
    font-family: -apple-system, sans-serif;
  }
  .err {
    color: #b23030; padding: 14px 18px;
    background: color-mix(in srgb, #b23030 8%, transparent);
    border: 1px solid color-mix(in srgb, #b23030 25%, transparent);
    border-radius: 6px; margin: 20px 24px; font-size: 13px;
    font-family: -apple-system, sans-serif;
  }
</style>
</head>
<body>
<div class="bar">
  <h1><b>Foc</b>us<b>Re</b>ad</h1>
  <span class="src" id="src">—</span>
  <button id="original">View original PDF</button>
</div>
<main>
  <div class="status" id="status">Loading PDF…</div>
  <div id="pages"></div>
</main>
<script src="vendor/pdf.min.js"></script>
<script src="core.js"></script>
<script src="viewer.js"></script>
</body>
</html>
