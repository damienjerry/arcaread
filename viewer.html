<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FocusRead PDF</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    font-size: 17px;
    line-height: 1.7;
  }
  .bar {
    position: sticky;
    top: 0;
    background: #111;
    border-bottom: 1px solid #333;
    padding: 10px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    z-index: 10;
  }
  .bar h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
  .bar h1 b { font-weight: 800; }
  .bar .src { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .bar button {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #333;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
  }
  .bar button:hover { background: #222; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .page {
    padding: 0 0 32px;
  }
  .page + .page {
    border-top: 1px dashed #333;
    padding-top: 32px;
  }
  .page-num {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .para { margin: 0 0 1em; }
  b { font-weight: 700; color: #fff; }
  .status {
    text-align: center;
    color: #888;
    padding: 40px 16px;
    font-size: 13px;
  }
  .err {
    color: #ff7b7b;
    padding: 16px;
    background: #2a1515;
    border: 1px solid #4a2020;
    border-radius: 4px;
    margin: 16px 24px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="bar">
  <h1><b>Foc</b>us<b>Re</b>ad</h1>
  <span class="src" id="src">—</span>
  <button id="original">View original</button>
</div>
<main>
  <div class="status" id="status">Loading PDF…</div>
  <div id="pages"></div>
</main>
<script src="vendor/pdf.min.js"></script>
<script src="core.js"></script>
<script src="viewer.js"></script>
</body>
</html>
